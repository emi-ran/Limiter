name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+(\.\d+)?$') { throw 'Expected a version tag such as v0.14 or v0.14.1.' }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) { throw "Missing release notes: $notes" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Limiter.EngineChecks/Limiter.EngineChecks.csproj
      - name: Build
        run: dotnet build Limiter.EngineChecks/Limiter.EngineChecks.csproj -c Release --no-restore
      - name: Check traffic engine
        run: dotnet run --project Limiter.EngineChecks/Limiter.EngineChecks.csproj -c Release --no-build
      - name: Publish Windows x64
        run: dotnet publish Limiter/Limiter.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, README.tr.md artifacts/publish/
          New-Item -ItemType Directory -Path artifacts/publish/docs/images -Force | Out-Null
          Copy-Item docs/images/*.png artifacts/publish/docs/images/
          Copy-Item docs/releases artifacts/publish/docs/ -Recurse
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/Limiter-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Limiter-win-x64
          path: artifacts/Limiter-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Limiter-win-x64
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/Limiter-win-x64.zip --verify-tag --title "Limiter ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
