name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+(\.\d+)?$') { throw 'Expected a version tag such as v0.14 or v0.14.1.' }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) { throw "Missing release notes: $notes" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Limiter.EngineChecks/Limiter.EngineChecks.csproj
      - name: Build
        run: dotnet build Limiter.EngineChecks/Limiter.EngineChecks.csproj -c Release --no-restore
      - name: Check traffic engine
        run: dotnet run --project Limiter.EngineChecks/Limiter.EngineChecks.csproj -c Release --no-build
      - name: Publish Windows x64
        run: dotnet publish Limiter/Limiter.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Restore installer tools
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'WiX restore failed' }
          dotnet tool run wix -- extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.BootstrapperApplications.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension restore failed' }
      - name: Build installers and portable package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./installer/Build-Packages.ps1
      - name: Check packages, desktop shortcut and startup task
        shell: pwsh
        run: ./installer/Test-Packages.ps1 -Install
      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics
          path: artifacts/packages/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Limiter-win-x64-packages
          path: |
            artifacts/packages/*.exe
            artifacts/packages/*.msi
            artifacts/packages/*portable*.zip
            artifacts/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Limiter-win-x64-packages
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.exe artifacts/*.msi artifacts/*portable*.zip artifacts/SHA256SUMS.txt --verify-tag --title "Limiter ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
